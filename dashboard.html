              snap.forEach(d => {
                const x = d.data() || {};
                if (!found && x.type === 'friend_request' && x.status === 'pending' && x.fromId === fromId && x.toId === uid())
                  found = d.id;
              });
              if (found) {
                await updateDoc(doc(db, 'feed', found), { status: 'accepted', acceptedAt: serverTimestamp() });
              }
              await addDoc(collection(db, 'feed'), {
                type: 'friendship',
                status: 'accepted',
                fromId: fromId,
                toId: uid(),
                timestamp: serverTimestamp(),
                userId: uid(),
                userName: myName()

          async function showMentionDropdown(input, startIdx, q, caretRect) {
            closeMention();

            const qq = q.toLowerCase();
            const list = users.filter(u => {
              if (u.uid === uid()) return false;
              const name = `${u.displayName || ''} ${u.username || ''} ${u.nickname || ''} ${u.email || ''}`.toLowerCase();
              return !qq || name.includes(qq);

            if (!list.length) return;
            mentionBox = document.createElement('div');
            mentionBox.className = 'mention-dropdown';
            mentionBox.innerHTML = list.map((u, i) => `<div class="mention-item ${i === 0 ? 'active' : ''}" data-uid="${escF(u.uid)}" data-name="${escF(u.displayName || u.username || u.email?.split('@')[0] || 'User')}">

            document.body.appendChild(mentionBox);
            const top = (caretRect?.bottom || 100) + 4;
            const left = caretRect?.left || 20;
            mentionBox.style.top = Math.min(top, innerHeight - 250) + 'px';
            mentionBox.style.left = Math.min(left, innerWidth - 240) + 'px';

          function insertMention(name, userId) {
            if (!mentionTarget) return;
            const el = mentionTarget;
            const val = el.value || '';
            const before = val.slice(0, mentionStart);
            const afterCursor = val.slice(el.selectionStart || val.length);
            // strip partial query after @
            const insert = `@${name} `;
            el.value = before + insert + afterCursor;
            // store mention meta on element
            el.dataset.mentions = JSON.stringify([...(JSON.parse(el.dataset.mentions || '[]')), { uid: userId, name }]);
            const pos = (before + insert).length;
            el.focus();
            el.setSelectionRange(pos, pos);
            closeMention();
            el.dispatchEvent(new Event('input', { bubbles: true }));
          }

          function handleMentionInput(e) {
            const el = e.target;
            if (!el || !('value' in el)) return;
            if (!(el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.isContentEditable)) return;
            const val = el.value || '';
            const caret = el.selectionStart ?? val.length;
            const left = val.slice(0, caret);
            const m = left.match(/@([^\s@]*)$/);
            if (!m) { closeMention(); return; }
            const start = caret - m[0].length;
            const q = m[1] || '';
            // approximate caret rect
            const rect = el.getBoundingClientRect();
            showMentionDropdown(el, start, q, { left: rect.left + 12, bottom: rect.top + 36 });
          }

          document.addEventListener('input', handleMentionInput, true);
          document.addEventListener('keydown', e => {
            if (!mentionBox) return;
            if (e.key === 'Escape') { closeMention(); return; }
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
              e.preventDefault();
              const items = [...mentionBox.querySelectorAll('.mention-item')];
              let idx = items.findIndex(x => x.classList.contains('active'));
              items.forEach(x => x.classList.remove('active'));
              if (e.key === 'ArrowDown') idx = (idx + 1) % items.length;
              else idx = (idx - 1 + items.length) % items.length;
              items[idx]?.classList.add('active');
              items[idx]?.scrollIntoView({ block: 'nearest' });
            }
            if (e.key === 'Enter' && mentionBox) {
              const active = mentionBox.querySelector('.mention-item.active');

              <div style="flex:1"><strong>${escF(peer.displayName || peer.email || '好友')}</strong><div class="timestamp">临时消息 · 可自动销毁</div></div>
              <button class="btn-sm" id="tempTtlBtn"><i class="fas fa-hourglass-half"></i> 时效</button></div>
              <div id="tempMessages" class="chat-messages">加载中…</div>
              <div style="display:flex;gap:7px;padding:8px;border-top:1px solid var(--border-color);flex-wrap:wrap;align-items:center">
                <select id="tempTtlSelect" class="modal-input" style="width:auto;margin:0;padding:6px 10px">
                  <option value="60">1 分钟后删除</option>
                  <option value="300">5 分钟后删除</option>
                  <option value="3600" selected>1 小时后删除</option>
                  <option value="86400">24 小时后删除</option>
                  <option value="604800">7 天后删除</option>
                  <option value="0">不自动删除</option>
                </select>
                <textarea id="tempInput" placeholder="输入临时消息，支持 @ 提及…" style="flex:1;min-height:42px;max-height:110px;resize:none;margin:0;border-radius:15px;padding:10px 12px"></textarea>
                <button class="dock-icon dock-send" id="tempSendBtn"><i class="fas fa-paper-plane"></i></button>
              </div></div></div>`;
            document.getElementById('tempBack').onclick = () => { tempChatPeer = null; if (tempUnsub) tempUnsub(); renderTempView(); };
            document.getElementById('tempSendBtn').onclick = sendTempMessage;
            document.getElementById('tempInput').addEventListener('keydown', e => {
              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTempMessage(); }
            });
            if (tempUnsub) tempUnsub();
            tempUnsub = onSnapshot(collection(db, 'feed'), snap => {
              const now = Date.now();
              const msgs = [];
              snap.forEach(d => {
                const x = d.data() || {};
                if (x.type !== 'tempMessage' || x.conversationId !== cid) return;
                if (x.expireAt && Number(x.expireAt) < now) return;
                msgs.push({ ...x, id: d.id });
              });
              msgs.sort((a, b) => {
                const ta = a.timestamp?.toDate ? a.timestamp.toDate().getTime() : 0;
                const tb = b.timestamp?.toDate ? b.timestamp.toDate().getTime() : 0;
                return ta - tb;
              });
              const box = document.getElementById('tempMessages');
              if (!box) return;
              box.innerHTML = msgs.map(m => {
                const mine = m.senderId === uid();
                const body = renderMarkdown(m.text || '');
                const ttl = m.expireAt ? `<div class="bubble-time">将于 ${new Date(Number(m.expireAt)).toLocaleString()} 删除</div>` : '';
                return `<div class="bubble ${mine ? 'mine' : ''}">${body}${ttl}<div class="bubble-time">${m.timestamp?.toDate ? m.timestamp.toDate().toLocaleTimeString() : ''}</div></div>`;
              }).join('') || '<div class="timestamp" style="text-align:center">开始临时会话吧</div>';
              box.scrollTop = box.scrollHeight;
            });
            // cleanup expired
            try {
              const snap = await getDocs(collection(db, 'feed'));
              const now = Date.now();
              snap.forEach(async d => {
                const x = d.data() || {};
                if (x.type === 'tempMessage' && x.expireAt && Number(x.expireAt) < now) {
                  try { await deleteDoc(doc(db, 'feed', d.id)); } catch {}
                }
              });
            } catch {}
          }

          async function sendTempMessage() {
            if (!currentUser || !tempChatPeer) return;
            const input = document.getElementById('tempInput');
            const text = input?.value.trim() || '';
            if (!text) return;
            const ttl = Number(document.getElementById('tempTtlSelect')?.value || 3600);
            const expireAt = ttl > 0 ? Date.now() + ttl * 1000 : null;
            const cid = tempConversationId(uid(), tempChatPeer.uid);
            const mentions = JSON.parse(input.dataset.mentions || '[]');
            try {
              await addDoc(collection(db, 'feed'), {
                type: 'tempMessage',
                conversationId: cid,
                senderId: uid(),
                receiverId: tempChatPeer.uid,
                text,
                mentions,
                expireAt,
                timestamp: serverTimestamp(),
                senderName: myName(),
                senderAvatar: myAvatar()
              });
              input.value = '';
              input.dataset.mentions = '[]';
            } catch (e) { await showAlert('发送失败：' + e.message); }
          }

                <button class="cs-big-btn" id="csBrowseBtn"><i class="fas fa-folder-open"></i><span>浏览代码空间</span><small style="font-weight:400;color:var(--text-secondary)">公开仓库与我的仓库</small></button>

          async function openCodespaceBySpaceId(spaceId) {
            try {

              snap.forEach(d => {

                }

          async function getCodespace(id) {
            const s = await getDoc(doc(db, 'feed', id));
            return s.exists() ? { id, ...s.data() } : null;
          }

          function getBranchFiles(cs, branch) {
            const b = (cs.branches || {})[branch || cs.defaultBranch || 'main'];
            return b?.files || {};
          }

          function pathParts(path) {
            return String(path || '').split('/').filter(Boolean);
          }

          function listDir(files, dirPath) {
            const prefix = dirPath ? dirPath.replace(/\/?$/, '/') : '';
            const folders = new Set();
            const fileList = [];
            Object.keys(files).forEach(p => {
              if (prefix && !p.startsWith(prefix)) return;
              const rest = prefix ? p.slice(prefix.length) : p;
              if (!rest) return;
              const seg = rest.split('/');
              if (seg.length > 1) folders.add(seg[0]);
              else if (files[p]?.type === 'file' || !files[p]?.type) fileList.push({ path: p, ...files[p], name: seg[0] });
              else if (files[p]?.type === 'folder') folders.add(seg[0]);
            });
            // also virtual folders from nested paths
            return {
              folders: [...folders].sort(),
              files: fileList.sort((a, b) => a.name.localeCompare(b.name))
            };
          }

          };

          // ---------- Diff / Hash helpers ----------
          function simpleHash(str) {
            // FNV-1a 32-bit + length for a stable short commit hash
            let h = 0x811c9dc5;
            const s = String(str || '');
            for (let i = 0; i < s.length; i++) {
              h ^= s.charCodeAt(i);
              h = Math.imul(h, 0x01000193);
            }
            const hex = (h >>> 0).toString(16).padStart(8, '0');
            const len = s.length.toString(16).padStart(4, '0');
            // mix timestamp entropy when creating real commits is done outside
            return hex + len;
          }
          function makeCommitHash(payload) {
            const base = simpleHash(JSON.stringify(payload));
            const t = Date.now().toString(16);
            return (base + t).slice(0, 40);
          }
          function computeLineDiff(oldText, newText) {
            const a = String(oldText || '').split('\n');
            const b = String(newText || '').split('\n');
            // Myers-like simplified LCS DP for moderate files
            const n = a.length, m = b.length;
            const MAX = 8000;
            if (n * m > MAX * 20) {
              // fallback for huge files: sequential compare
              const out = [];
              const max = Math.max(n, m);
              for (let i = 0; i < max; i++) {
                const L = a[i], R = b[i];
                if (L === R) out.push({ type: 'same', text: L ?? '', oldNo: i + 1, newNo: i + 1 });
                else {
                  if (L !== undefined) out.push({ type: 'del', text: L, oldNo: i + 1, newNo: null });
                  if (R !== undefined) out.push({ type: 'add', text: R, oldNo: null, newNo: i + 1 });
                }
              }
              return out;
            }
            const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
            for (let i = n - 1; i >= 0; i--) {
              for (let j = m - 1; j >= 0; j--) {
                dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
              }
            }
            const out = [];
            let i = 0, j = 0, oldNo = 1, newNo = 1;
            while (i < n && j < m) {
              if (a[i] === b[j]) {
                out.push({ type: 'same', text: a[i], oldNo: oldNo++, newNo: newNo++ });
                i++; j++;
              } else if (dp[i + 1][j] >= dp[i][j + 1]) {
                out.push({ type: 'del', text: a[i], oldNo: oldNo++, newNo: null });
                i++;
              } else {
                out.push({ type: 'add', text: b[j], oldNo: null, newNo: newNo++ });
                j++;
              }
            }
            while (i < n) out.push({ type: 'del', text: a[i++], oldNo: oldNo++, newNo: null });
            while (j < m) out.push({ type: 'add', text: b[j++], oldNo: null, newNo: newNo++ });
            return out;
          }
          function renderDiffHtml(diffLines) {
            if (!diffLines?.length) return '<div class="timestamp">无差异</div>';
            const rows = diffLines.map(d => {
              const cls = d.type === 'add' ? 'cs-diff-add' : d.type === 'del' ? 'cs-diff-del' : 'cs-diff-same';
              const sign = d.type === 'add' ? '+' : d.type === 'del' ? '−' : ' ';
              const on = d.oldNo != null ? d.oldNo : '';
              const nn = d.newNo != null ? d.newNo : '';
              return `<div class="cs-diff-line ${cls}"><span class="cs-diff-no">${on}</span><span class="cs-diff-no">${nn}</span><span class="cs-diff-sign">${sign}</span><pre class="cs-diff-text">${escF(d.text)}</pre></div>`;
            }).join('');
            const adds = diffLines.filter(x => x.type === 'add').length;
            const dels = diffLines.filter(x => x.type === 'del').length;
            return `<div class="cs-diff-summary timestamp" style="margin-bottom:8px">+${adds} / −${dels} · 共 ${diffLines.length} 行视图</div><div class="cs-diff-box">${rows}</div>`;
          }
          function ensureCsDiffStyles() {
            if (document.getElementById('cs-diff-style')) return;
            const st = document.createElement('style');
            st.id = 'cs-diff-style';
            st.textContent = `
              .cs-diff-box{border:1px solid var(--border-color);border-radius:12px;overflow:auto;max-height:min(55vh,520px);background:var(--bg-secondary);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px}
              .cs-diff-line{display:grid;grid-template-columns:44px 44px 18px 1fr;gap:0;border-bottom:1px solid color-mix(in srgb,var(--border-color) 60%,transparent)}
              .cs-diff-line:last-child{border-bottom:0}
              .cs-diff-no{opacity:.45;text-align:right;padding:2px 6px;user-select:none}
              .cs-diff-sign{text-align:center;padding:2px 0;user-select:none}
              .cs-diff-text{margin:0;padding:2px 8px;white-space:pre-wrap;word-break:break-word;background:transparent;border:0}
              .cs-diff-add{background:rgba(46,160,67,.15)}
              .cs-diff-add .cs-diff-sign{color:#2ea043}
              .cs-diff-del{background:rgba(248,81,73,.14)}
              .cs-diff-del .cs-diff-sign{color:#f85149}
              .cs-diff-same{opacity:.92}
              body.dark .cs-diff-add{background:rgba(46,160,67,.22)}
              body.dark .cs-diff-del{background:rgba(248,81,73,.2)}
              .cs-commit-row:hover{background:var(--button-hover)}
              .cs-md-preview{padding:12px;border:1px solid var(--border-color);border-radius:12px;background:var(--card-bg);line-height:1.6}
              .cs-md-preview pre{background:var(--bg-secondary);padding:10px;border-radius:8px;overflow:auto}
              .cs-md-preview code{font-family:ui-monospace,monospace;font-size:.9em}
              .cs-md-preview table{border-collapse:collapse;width:100%}
              .cs-md-preview th,.cs-md-preview td{border:1px solid var(--border-color);padding:4px 8px}
            `;
            document.head.appendChild(st);
          }
          ensureCsDiffStyles();

          async function openCodespaceFileEditor(csId, filePath, branch) {
            const cs = await getCodespace(csId);
            if (!cs) { await showAlert('Codespace 不存在'); return; }
            if (cs.visibility === 'private' && cs.ownerId !== uid()) {

            branch = branch || activeBranch || cs.defaultBranch || 'main';
            const files = getBranchFiles(cs, branch);
            const f = files[filePath];

            let original = (f.content != null) ? String(f.content) : '';
            let loadedFromUrl = false;
            if ((original === '' || original == null) && f.url) {

              <div class="top-bar">

                ${isMd ? `<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Markdown 实时预览</strong><button class="btn-sm" id="csMdToggle" type="button">刷新预览</button></div><div id="csMdLive" class="cs-md-preview" style="margin-top:8px"></div></div>` : ''}
              </div>

              <div class="profile-card" style="display:block;margin-bottom:12px">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                  <strong>提交前 Diff 对比</strong>
                  <button class="btn-sm" id="csDiffRefresh" type="button"><i class="fas fa-sync"></i> 刷新 Diff</button>
                </div>
                <div id="csLiveDiff" style="margin-top:10px"></div>
              </div>

              <div class="profile-card" style="display:block;margin-bottom:12px">
                <strong>提交更改</strong>
                <div class="timestamp" style="margin:6px 0 10px">填写提交信息后进入「提交信息」确认页（含 Diff、哈希、Markdown 预览），确认后才会真正写入。</div>
                <label class="timestamp" style="display:block;margin-bottom:4px">Commit message（必填）</label>
                <input id="csCommitMsg" class="modal-input" placeholder="例如：Fix typo in README" maxlength="200">

                <textarea id="csCommitDesc" class="modal-input" placeholder="可选：更详细的变更说明…" style="min-height:80px;resize:vertical"></textarea>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end">
                  <button class="btn-sm" id="csEditCancel">取消</button>

                </div>
              </div>
            </div>`;

            const contentEl = document.getElementById('csEditContent');
            const lenEl = document.getElementById('csEditLen');
            const diffBox = document.getElementById('csLiveDiff');
            const refreshDiff = () => {
              const diff = computeLineDiff(original, contentEl?.value ?? '');
              diffBox.innerHTML = renderDiffHtml(diff);

            const refreshMd = () => {
              const el = document.getElementById('csMdLive');
              if (!el) return;

            contentEl?.addEventListener('input', () => {

              if (isMd) refreshMd();

            document.getElementById('csDiffRefresh')?.addEventListener('click', refreshDiff);
            document.getElementById('csMdToggle')?.addEventListener('click', refreshMd);
            refreshDiff();
            if (isMd) refreshMd();

            const goBack = () => {
              const dir = filePath.includes('/') ? filePath.split('/').slice(0, -1).join('/') : '';
              openCodespaceDetail(csId, { branch, path: dir, tab: 'code' });

            document.getElementById('csEditSubmit').onclick = async () => {
              const msg = (document.getElementById('csCommitMsg')?.value || '').trim();
              const desc = (document.getElementById('csCommitDesc')?.value || '').trim();

              if (!msg) {
                await showAlert('请填写必选的 Commit message。');
                document.getElementById('csCommitMsg')?.focus();
                return;

              if (newContent === original) {
                const ok = await showConfirm('内容与原文件相同，仍要继续提交吗？');
                if (!ok) return;
              }
              // 进入提交信息确认页（尚未写入）
              openCodespaceCommitConfirm({
                csId, csName: cs.name, branch, filePath,

          }

          async function openCodespaceCommitConfirm(ctx) {
            const { csId, csName, branch, filePath, original, newContent, msg, desc } = ctx;
            const panel = document.getElementById('viewCodespaceCommit');
            if (!panel) { await showAlert('提交信息页面不存在'); return; }
            document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
            panel.classList.add('active');

            const diff = computeLineDiff(original, newContent);
            const payload = {
              space: csId, branch, filePath, msg, desc,
              before: original, after: newContent,
              author: uid(), at: nowIso()
            };
            const hash = makeCommitHash(payload);
            const msgLooksMd = /[#*_`\[\]]|\n- |\n\d+\. /.test(msg + '\n' + desc);

            panel.innerHTML = `<div class="app-container" style="max-width:980px">
              <div class="top-bar">

                  <h3 style="margin:0"><i class="fas fa-code-commit"></i> 提交信息</h3>

              <div class="profile-card" style="display:block;margin-bottom:12px">

              </div>

              <div class="profile-card" style="display:block;margin-bottom:12px">
                <strong>Commit message</strong>

                ${desc ? `<div class="timestamp" style="margin-top:10px">补充说明</div><div id="csCommitDescView" style="margin-top:6px"></div>` : ''}
                ${msgLooksMd ? `<div style="margin-top:12px"><strong>Markdown 预览</strong><div id="csCommitMdPreview" class="cs-md-preview" style="margin-top:8px"></div></div>` : ''}
              </div>

              <div class="profile-card" style="display:block;margin-bottom:12px">

          async function openCodespaceCommitDetail(csId, commitIdx) {
            const cs = await getCodespace(csId);
            if (!cs) return;
            const c = (cs.commits || [])[commitIdx];
            if (!c) { await showAlert('提交记录不存在'); return; }
            const panel = document.getElementById('viewCodespaceCommit');
            document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));

            const before = c.beforeSnippet != null ? c.beforeSnippet : '';
            const after = c.afterSnippet != null ? c.afterSnippet : '';
            const hasSnippets = c.beforeSnippet != null || c.afterSnippet != null;
            const diffHtml = hasSnippets ? renderDiffHtml(computeLineDiff(before, after)) : '<div class="timestamp">此提交未保存完整 diff 快照（可能是早期提交或非文本编辑）。</div>';
            const msgLooksMd = /[#*_`\[\]]|\n- |\n\d+\. /.test((c.message || '') + '\n' + (c.description || ''));

            panel.innerHTML = `<div class="app-container" style="max-width:980px">
              <div class="top-bar">
                <button class="btn-sm" id="csCommitDetailBack"><i class="fas fa-arrow-left"></i> 返回仓库</button>
                <div style="flex:1;min-width:0">
                  <h3 style="margin:0">提交详情</h3>
                  <div class="timestamp">${escF(cs.name)} · ${escF(c.branch || '')}</div>
                </div>
              </div>
              <div class="profile-card" style="display:block;margin-bottom:12px">
                <div class="timestamp">Commit Hash</div>
                <code style="word-break:break-all">${escF(c.hash || '（无哈希）')}</code>
                <div class="timestamp" style="margin-top:8px">${escF(c.authorName)} · ${escF(c.timestamp)} · ${(c.filesChanged || []).map(escF).join(', ')}</div>
                ${c.diffMeta ? `<div class="timestamp" style="margin-top:4px">+${c.diffMeta.additions || 0} / −${c.diffMeta.deletions || 0}</div>` : ''}
              </div>
              <div class="profile-card" style="display:block;margin-bottom:12px">
                <strong>${escF(c.message || '')}</strong>
                ${c.description ? `<div id="csHistDesc" style="margin-top:10px"></div>` : ''}
                ${msgLooksMd ? `<div style="margin-top:12px"><strong>Markdown 预览</strong><div id="csHistMd" class="cs-md-preview" style="margin-top:8px"></div></div>` : ''}
              </div>
              <div class="profile-card" style="display:block;margin-bottom:12px">
                <strong>Diff 对比</strong>
                <div style="margin-top:10px">${diffHtml}</div>
              </div>
            </div>`;
            document.getElementById('csCommitDetailBack').onclick = () => openCodespaceDetail(csId, { branch: activeBranch });
            if (c.description) {
              const el = document.getElementById('csHistDesc');
              if (el) { try { el.innerHTML = renderMarkdown(c.description); } catch { el.textContent = c.description; } }
            }
            if (msgLooksMd) {
              const el = document.getElementById('csHistMd');
              if (el) {
                const src = c.description ? `# ${c.message}\n\n${c.description}` : (c.message || '');
                try { el.innerHTML = renderMarkdown(src); } catch { el.textContent = src; }
              }
            }
          }

          async function renameCodespaceFile(csId, oldPath) {
            const base = oldPath.split('/').pop();
            const dir = oldPath.includes('/') ? oldPath.split('/').slice(0, -1).join('/') : '';
            const name = await showPrompt('新文件名（不含路径）', '改文件名', base);
            if (!name || !name.trim()) return;
            if (name.includes('/')) { await showAlert('文件名不能包含 /，如需改路径请使用「移动」'); return; }
            const newPath = dir ? dir + '/' + name.trim() : name.trim();
            if (newPath === oldPath) return;
            const cs = await getCodespace(csId);
            const branch = activeBranch;
            const files = { ...getBranchFiles(cs, branch) };
            if (!files[oldPath]) { await showAlert('原文件不存在'); return; }
            if (files[newPath]) { await showAlert('目标文件名已存在'); return; }
            const msg = await showPrompt('Commit message（必填）', '改名提交', `Rename ${base} → ${name.trim()}`);
            if (!msg || !msg.trim()) { await showAlert('需要填写 Commit message'); return; }
            files[newPath] = { ...files[oldPath], name: name.trim(), updatedAt: nowIso(), updatedBy: uid() };
            delete files[oldPath];
            const branches = { ...(cs.branches || {}) };
            branches[branch] = { ...(branches[branch] || { name: branch }), files };
            const hash = makeCommitHash({ action: 'rename', oldPath, newPath, msg, at: nowIso() });
            const commits = [...(cs.commits || []), {
              message: msg.trim(), description: '', hash, branch,
              authorId: uid(), authorName: myName(), timestamp: nowIso(),
              filesChanged: [oldPath, newPath], action: 'rename',
              beforeSnippet: oldPath, afterSnippet: newPath
            }];
            await updateDoc(doc(db, 'feed', csId), { branches, commits });
            await showAlert('已改名');
            openCodespaceDetail(csId, { branch, path: dir, tab: 'code' });
          }

          async function moveCodespaceFile(csId, oldPath) {
            const base = oldPath.split('/').pop();
            const curDir = oldPath.includes('/') ? oldPath.split('/').slice(0, -1).join('/') : '';
            const dest = await showPrompt(
              '目标目录路径（留空表示根目录；不要以 / 开头或结尾）\n当前：' + (curDir || '（根目录）'),
              '移动路径',
              curDir
            );
            if (dest === null) return;
            const cleanDir = String(dest).replace(/^\/+|\/+$/g, '').trim();
            const newPath = cleanDir ? cleanDir + '/' + base : base;
            if (newPath === oldPath) { await showAlert('路径未变化'); return; }
            const cs = await getCodespace(csId);
            const branch = activeBranch;
            const files = { ...getBranchFiles(cs, branch) };
            if (!files[oldPath]) { await showAlert('原文件不存在'); return; }
            if (files[newPath]) { await showAlert('目标路径已存在同名文件'); return; }
            const msg = await showPrompt('Commit message（必填）', '移动提交', `Move ${oldPath} → ${newPath}`);
            if (!msg || !msg.trim()) { await showAlert('需要填写 Commit message'); return; }
            files[newPath] = { ...files[oldPath], name: base, updatedAt: nowIso(), updatedBy: uid() };
            delete files[oldPath];
            // ensure folder placeholder if needed
            if (cleanDir) {
              const keep = cleanDir + '/.keep';
              if (!Object.keys(files).some(p => p.startsWith(cleanDir + '/') && p !== newPath) && !files[keep]) {
                // optional: skip .keep if file itself creates the folder path
              }
            }
            const branches = { ...(cs.branches || {}) };
            branches[branch] = { ...(branches[branch] || { name: branch }), files };
            const hash = makeCommitHash({ action: 'move', oldPath, newPath, msg, at: nowIso() });
            const commits = [...(cs.commits || []), {
              message: msg.trim(), description: '', hash, branch,
              authorId: uid(), authorName: myName(), timestamp: nowIso(),
              filesChanged: [oldPath, newPath], action: 'move',
              beforeSnippet: oldPath, afterSnippet: newPath
            }];
            await updateDoc(doc(db, 'feed', csId), { branches, commits });
            await showAlert('已移动到：' + newPath);
            openCodespaceDetail(csId, { branch, path: cleanDir, tab: 'code' });
          }

          async function leaveForkNetwork(csId) {
            const cs = await getCodespace(csId);
            if (!cs) return;
            if (cs.ownerId !== uid()) {
              await showAlert('仅仓库所有者可以离开复刻网络');
              return;
            }
            if (!cs.forkedFrom) {
              await showAlert('当前仓库不在复刻网络中');
              return;
            }
            const src = cs.forkedFrom;
            const ok = await showConfirm(
              `确定离开复刻网络？\n\n当前仓库将不再关联源仓库：\n${src.name || ''} (Space ID: ${src.spaceId || ''})\n\n离开后此仓库将变为独立仓库，此操作不可自动恢复。`,
              '离开复刻网络'
            );
            if (!ok) return;
            try {
              const hash = makeCommitHash({ action: 'detach-fork', from: src.spaceId, at: nowIso() });
              const commits = [...(cs.commits || []), {
                message: 'Leave fork network',
                description: `Detached from ${src.name || ''} (${src.spaceId || ''})`,
                hash,
                branch: cs.defaultBranch || 'main',
                authorId: uid(),
                authorName: myName(),
                timestamp: nowIso(),
                filesChanged: [],
                action: 'detach-fork'
              }];
              await updateDoc(doc(db, 'feed', csId), {
                forkedFrom: null,
                detachedFromFork: {
                  id: src.id || null,
                  spaceId: src.spaceId || null,
                  name: src.name || null,
                  ownerId: src.ownerId || null,
                  at: nowIso(),
                  by: uid()
                },
                commits
              });
              await showAlert('已离开复刻网络，本仓库现为独立仓库。');
              openCodespaceDetail(csId, { branch: activeBranch });
            } catch (e) {
              await showAlert('操作失败：' + e.message);
            }
          }

          function previewCodespaceFile(cs, path) {
            const files = getBranchFiles(cs, activeBranch);
            const f = files[path];
            const box = document.getElementById('csFilePreview');
            if (!box || !f) return;
            const isMd = /\.md$/i.test(path);
            const actions = `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn-sm" data-pe="edit"><i class="fas fa-edit"></i> 更改</button>
              <button class="btn-sm" data-pe="rename"><i class="fas fa-i-cursor"></i> 改名</button>
              <button class="btn-sm" data-pe="move"><i class="fas fa-folder-open"></i> 移动</button>
            </div>`;
            const bindPreviewActions = () => {
              const id = cs.id || activeCodespaceId;
              box.querySelector('[data-pe="edit"]')?.addEventListener('click', () => openCodespaceFileEditor(id, path, activeBranch));
              box.querySelector('[data-pe="rename"]')?.addEventListener('click', () => renameCodespaceFile(id, path));
              box.querySelector('[data-pe="move"]')?.addEventListener('click', () => moveCodespaceFile(id, path));
            };

            if (f.url && /\.(png|jpe?g|gif|webp|svg)$/i.test(path)) {
              box.innerHTML = `<div class="profile-card" style="display:block"><strong>${escF(path)}</strong><div style="margin-top:8px"><img class="file-preview-img" src="${escF(f.url)}"></div>${actions}</div>`;
              bindPreviewActions();
            } else if (f.content != null) {
              if (isMd) {
                let mdHtml = '';
                try { mdHtml = renderMarkdown(f.content); } catch { mdHtml = escF(f.content); }
                box.innerHTML = `<div class="profile-card" style="display:block">
                  <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
                    <strong>${escF(path)}</strong>
                    <div style="display:flex;gap:6px">
                      <button class="btn-sm" id="csMdShowPreview">预览</button>
                      <button class="btn-sm" id="csMdShowSource">源码</button>
                    </div>
                  </div>
                  <div id="csMdPreviewPane" class="cs-md-preview" style="margin-top:10px">${mdHtml}</div>
                  <pre id="csMdSourcePane" style="display:none;margin-top:10px;white-space:pre-wrap;max-height:420px;overflow:auto">${escF(f.content)}</pre>
                  ${actions}
                </div>`;
                box.querySelector('#csMdShowPreview')?.addEventListener('click', () => {
                  box.querySelector('#csMdPreviewPane').style.display = 'block';
                  box.querySelector('#csMdSourcePane').style.display = 'none';
                });
                box.querySelector('#csMdShowSource')?.addEventListener('click', () => {
                  box.querySelector('#csMdPreviewPane').style.display = 'none';
                  box.querySelector('#csMdSourcePane').style.display = 'block';
                });
                bindPreviewActions();
              } else {
                box.innerHTML = `<div class="profile-card" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><strong>${escF(path)}</strong></div>
                  <pre style="margin-top:8px;white-space:pre-wrap;max-height:420px;overflow:auto">${escF(f.content)}</pre>${actions}</div>`;
                bindPreviewActions();
              }
            } else if (f.url) {
              // try fetch text for md remote
              box.innerHTML = `<div class="profile-card" style="display:block"><strong>${escF(path)}</strong>
                <div style="margin-top:8px"><a href="${escF(f.url)}" target="_blank" class="file-link">打开 / 下载文件</a></div>
                <div id="csRemotePreview" class="timestamp" style="margin-top:8px">加载中…</div>${actions}</div>`;
              bindPreviewActions();
              if (isMd || !/\.(png|jpe?g|gif|webp|pdf|zip)$/i.test(path)) {
                fetch(f.url).then(r => r.ok ? r.text() : Promise.reject()).then(t => {
                  const el = document.getElementById('csRemotePreview');
                  if (!el) return;
                  if (isMd) {
                    try { el.className = 'cs-md-preview'; el.style.marginTop = '10px'; el.innerHTML = renderMarkdown(t); }
                    catch { el.textContent = t; }
                  } else {
                    el.outerHTML = `<pre style="margin-top:10px;white-space:pre-wrap;max-height:420px;overflow:auto">${escF(t.slice(0, 100000))}</pre>`;
                  }
                }).catch(() => {
                  const el = document.getElementById('csRemotePreview');
                  if (el) el.textContent = '无法预览远程内容';
                });
              } else {
                const el = document.getElementById('csRemotePreview');
                if (el) el.textContent = '';
              }
            } else {
              box.innerHTML = '<div class="timestamp">无法预览</div>';
            }
          }

          async function createKidax(csId) {
            const cs = await getCodespace(csId);
            const branches = Object.keys(cs.branches || { main: 1 });
            const title = await showPrompt('Kidax 标题', '新建 Kidax（类似 PR）');
            if (!title) return;
            const fromBranch = await showPrompt(`源分支（可选：${branches.join(', ')}）`, 'From', activeBranch);
            if (!fromBranch) return;
            const toBranch = await showPrompt(`目标分支（可选：${branches.join(', ')}）`, 'To', cs.defaultBranch || 'main');
            if (!toBranch) return;
            const body = await showPrompt('说明', '描述', '') || '';
            const kidaxes = [...(cs.kidaxes || []), {
              title: title.trim(), body, status: 'open',
              fromBranch, toBranch,
              authorId: uid(), authorName: myName(), createdAt: nowIso()
            }];
            await updateDoc(doc(db, 'feed', csId), { kidaxes });
            openCodespaceDetail(csId, { tab: 'kidax', branch: activeBranch });
          }

          async function setKidaxStatus(csId, idx, status) {
            const cs = await getCodespace(csId);
            const kidaxes = [...(cs.kidaxes || [])];
            if (!kidaxes[idx]) return;
            kidaxes[idx] = { ...kidaxes[idx], status };
            await updateDoc(doc(db, 'feed', csId), { kidaxes });
            openCodespaceDetail(csId, { tab: 'kidax', branch: activeBranch });
          }

          async function mergeKidax(csId, idx) {
            const cs = await getCodespace(csId);
            if (cs.ownerId !== uid()) { await showAlert('仅所有者可合并'); return; }
            const k = (cs.kidaxes || [])[idx];
            if (!k) return;
            const fromFiles = getBranchFiles(cs, k.fromBranch);
            const toFiles = { ...getBranchFiles(cs, k.toBranch), ...fromFiles };
            const branches = { ...(cs.branches || {}) };
            branches[k.toBranch] = { ...(branches[k.toBranch] || { name: k.toBranch }), files: toFiles };
            const kidaxes = [...(cs.kidaxes || [])];
            kidaxes[idx] = { ...k, status: 'merged', mergedAt: nowIso(), mergedBy: uid() };
            const commits = [...(cs.commits || []), {
              message: `Merge kidax: ${k.title}`,
              branch: k.toBranch,
              authorId: uid(),
              authorName: myName(),
              timestamp: nowIso(),
              filesChanged: Object.keys(fromFiles)
            }];
            await updateDoc(doc(db, 'feed', csId), { branches, kidaxes, commits });
            await showAlert('Kidax 已合并到 ' + k.toBranch);
            openCodespaceDetail(csId, { tab: 'kidax', branch: k.toBranch });
          }

          // ---------- Notification extensions for friends ----------
          const _oldInspect = null;
          // Hook into notification listener by watching friend_request docs
          onAuthStateChanged(auth, user => {
            if (!user) return;
            setTimeout(() => {
              try {
                onSnapshot(collection(db, 'feed'), snap => {
                  if (!currentUser) return;
                  snap.docChanges().forEach(ch => {
                    if (ch.type !== 'added' && ch.type !== 'modified') return;
                    const data = ch.doc.data() || {};
                    if (data.type === 'friend_request' && data.status === 'pending' && data.toId === currentUser.uid && data.fromId !== currentUser.uid) {
                      try {
                        const key = 'devcom_notifications_' + currentUser.uid;
                        const arr = JSON.parse(localStorage.getItem(key) || '[]');
                        const sourceId = ch.doc.id;
                        if (arr.some(x => x.sourceId === sourceId && x.kind === 'friend_in')) return;
                        arr.unshift({
                          id: 'fr_in_' + sourceId,
                          time: Date.now(),
                          read: false,
                          kind: 'friend_in',
                          sourceId,
                          fromId: data.fromId,
                          from: data.fromName || '用户',
                          preview: '收到一条好友申请'
                        });
                        localStorage.setItem(key, JSON.stringify(arr.slice(0, 200)));
                        if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
                        if (typeof playNotificationSound === 'function') playNotificationSound('mention');
                        else if (window.__playDevcomNotificationSound) window.__playDevcomNotificationSound('mention');
                      } catch {}
                    }
                  });
                });
              } catch {}
            }, 800);
          });

          // Extend notification text & open for friend kinds
          const _origNotifText = null;
          // Patch openNotification via event delegation on notification cards is complex;
          // enhance renderNotificationsView when friends kinds present by wrapping after load.
          const enhanceNotifOpen = () => {
            document.addEventListener('click', async e => {
              const card = e.target.closest('[data-notif-id]');
              if (!card || e.target.closest('[data-notif-delete]')) return;
              try {
                const key = 'devcom_notifications_' + (currentUser?.uid || '');
                const arr = JSON.parse(localStorage.getItem(key) || '[]');
                const n = arr.find(x => x.id === card.dataset.notifId);
                if (!n) return;
                if (n.kind === 'friend_in' || n.kind === 'friend_out') {
                  e.stopPropagation();
                  n.read = true;
                  localStorage.setItem(key, JSON.stringify(arr));
                  if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
                  if (n.fromId) {
                    if (typeof renderProfile === 'function') renderProfile(n.fromId);
                  }
                }
              } catch {}
            }, true);
          };
          enhanceNotifOpen();

          // Patch notificationText display by enhancing cards after render
          const _rn = window.renderNotificationsView;
          if (typeof _rn === 'function') {
            window.renderNotificationsView = function () {
              _rn();
              const panel = document.getElementById('viewNotifications');
              if (!panel) return;
              try {
                const key = 'devcom_notifications_' + (currentUser?.uid || '');
                const arr = JSON.parse(localStorage.getItem(key) || '[]');
                panel.querySelectorAll('[data-notif-id]').forEach(card => {
                  const n = arr.find(x => x.id === card.dataset.notifId);
                  if (!n) return;
                  const title = card.querySelector('.dev-notif-title');
                  if (!title) return;
                  if (n.kind === 'friend_in') title.textContent = `${n.from || '用户'} 发来好友申请`;
                  if (n.kind === 'friend_out') title.textContent = `已向 ${n.from || '用户'} 发送好友申请`;
                });
              } catch {}
            };
          }

          // Expose globals used by switchView / notifications
          window.renderFriendsView = window.renderFriendsView;
          window.renderTempView = window.renderTempView;
          window.renderCodespaceView = window.renderCodespaceView;
          window.openTempChat = openTempChat;
          window.openCodespaceBySpaceId = openCodespaceBySpaceId;
          window.openCodespaceDetail = openCodespaceDetail;
          window.openCodespaceFileEditor = openCodespaceFileEditor;
          window.leaveForkNetwork = leaveForkNetwork;
          window.openCodespaceCommitDetail = openCodespaceCommitDetail;
          window.openCodespaceCommitConfirm = openCodespaceCommitConfirm;
          window.renameCodespaceFile = renameCodespaceFile;
          window.moveCodespaceFile = moveCodespaceFile;
          Object.defineProperty(window, 'tempChatPeer', {
            get(){ return tempChatPeer; },
            set(v){ tempChatPeer = v; }
          });

        })();



    </script>
</body>
</html>
