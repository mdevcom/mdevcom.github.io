            const users=await getAllUsers(); const q=term.toLowerCase();
            const list=users.filter(u=>u.uid!==currentUser.uid && (`${u.displayName||''} ${u.nickname||''} ${u.email||''}`).toLowerCase().includes(q)).slice(0,30);
            const el=document.getElementById('chatUserResults'); if(el)el.innerHTML=list.map(u=>`<div class="chat-row user-clickable" data-chat-user="${esc(u.uid)}">${userRow(u,'chat')}</div>`).join('')||'没有匹配用户';
            el?.querySelectorAll('[data-chat-user]').forEach(x=>x.onclick=()=>{activeChat=userCache.get(x.dataset.chatUser);renderChatWindow(document.getElementById('viewChats'));composerDock.style.display='block'});
        }
        function conversationId(a,b){return [a,b].sort().join('_')}
        function renderChatWindow(panel){
            const other=activeChat; const cid=conversationId(currentUser.uid,other.uid);
            panel.innerHTML=`<div class="app-container"><div class="chat-window">
              <div class="chat-head"><button class="btn-sm" id="backChats">${icon('arrow_back')}</button><img class="result-avatar" src="${esc(avatarOf(other))}"><div style="flex:1"><strong>${esc(other.displayName||other.email)}</strong><div class="timestamp">实时消息</div></div></div>
              <div id="chatMessages" class="chat-messages">加载中…</div></div></div>`;
            document.getElementById('backChats').onclick=()=>{activeChat=null;if(chatUnsub)chatUnsub();composerDock.style.display='none';renderChatsView()};
            if(chatUnsub)chatUnsub();
            try{
              const q=query(collection(db,'feed'),orderBy('timestamp','asc'));
              chatUnsub=onSnapshot(q,snap=>{
                const msgs=[];snap.forEach(d=>{const x=d.data();if(x.type==='dm' && x.conversationId===cid)msgs.push(x)});
                const box=document.getElementById('chatMessages');if(!box)return;
                box.innerHTML=msgs.map(m=>`<div class="bubble ${m.senderId===currentUser.uid?'mine':''}">${renderMarkdown(m.text||'')}${m.fileUrl?`<div><a href="${esc(m.fileUrl)}" target="_blank" style="color:inherit">${icon('attach_file')}${esc(m.fileName||'文件')}</a></div>`:''}<div class="bubble-time">${m.timestamp?.toDate?m.timestamp.toDate().toLocaleTimeString():''}</div></div>`).join('')||'<div class="timestamp" style="text-align:center">开始聊天吧</div>';
                box.scrollTop=box.scrollHeight;
              });
            }catch(e){document.getElementById('chatMessages').textContent='聊天读取失败：'+e.message}
        }
        async function sendChatMessage(){
            if(!currentUser||!activeChat)return;
            const text=chatInput.value.trim(); const files=chatFileInput.files;
            if(!text && !files.length)return;
            const cid=conversationId(currentUser.uid,activeChat.uid);
            let uploaded=null;
            if(files.length) uploaded=await uploadToCloudinary(files[0],'chat_files');
            try{
              await addDoc(collection(db,'feed'),{type:'dm',conversationId:cid,senderId:currentUser.uid,receiverId:activeChat.uid,text,timestamp:serverTimestamp(),fileUrl:uploaded?.url||null,fileName:files[0]?.name||null});
              chatInput.value='';chatFileInput.value='';
            }catch(e){await showAlert('消息发送失败：'+e.message+'\n请确认原有 feed 集合允许登录用户发布内容。')}
        }
        chatSendBtn?.addEventListener('click',sendChatMessage);
        chatInput?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMessage()}});

        async function renderGroupsView(){
          const panel=document.getElementById('viewGroups');
          panel.innerHTML=`<div class="app-container"><div class="top-bar"><h3><i class="fas fa-users"></i> 群聊</h3><button class="btn-primary" id="newGroupBtn"><i class="fas fa-plus"></i> 新建群</button></div><div id="groupList" class="group-list">加载中…</div></div>`;
          try{
            const snap=await getDocs(query(collection(db,'feed'),orderBy('timestamp','desc')));
            const arr=[];
            snap.forEach(d=>{
              const x=d.data()||{};
              const members=x.members||x.memberIds||[];
              if(x.type==='group' && (members.includes(currentUser.uid)||x.ownerId===currentUser.uid||x.creatorId===currentUser.uid)) arr.push({id:d.id,...x});
            });
            // 刚创建的群即使时间戳尚未返回，也确保出现在“已加入群组”。
            const created=window.__createdGroups||new Set();
            for(const gid of created){
              if(!arr.some(g=>g.id===gid)){
                try{const d=await getDoc(doc(db,'feed',gid));if(d.exists()) arr.unshift({id:d.id,...d.data()});}catch(e){}
              }
            }
            document.getElementById('groupList').innerHTML=arr.map(g=>`<div class="group-row" data-group="${esc(g.id)}">
              <img class="result-avatar" src="${esc(g.avatar||g.userAvatar||`https://ui-avatars.com/api/?background=0969da&color=fff&name=${encodeURIComponent(g.name||'Group')}`)}" onerror="this.src='https://ui-avatars.com/api/?background=0969da&color=fff&name=Group'">
              <div style="flex:1;min-width:0"><strong>${esc(g.name||'未命名群')}</strong><div class="timestamp">${(g.members||g.memberIds||[]).length} 名成员 · <span style="color:var(--accent)">已加入</span></div></div><i class="fas fa-chevron-right"></i>
            </div>`).join('')||'还没有加入群聊';
            document.querySelectorAll('[data-group]').forEach(x=>x.onclick=()=>openGroup(x.dataset.group));
          }catch(e){document.getElementById('groupList').textContent='群组读取失败：'+e.message}
          document.getElementById('newGroupBtn').onclick=createGroup;
        }
        async function createGroup(){
          const name=await showPrompt('群名称','新建群');
          if(!name || !currentUser) return;
          const inviteCode = ('MB' + Math.random().toString(36).slice(2,10)).toUpperCase();
          const groupData={
            type:'group', name:name.trim(), ownerId:currentUser.uid,
            creatorId:currentUser.uid,
            members:[currentUser.uid], memberIds:[currentUser.uid],
            joinedUsers:[currentUser.uid],
            inviteCode, avatar:currentUser.photoURL||'',
            userId:currentUser.uid, userName:currentUser.displayName||currentUser.email?.split('@')[0]||'User',
            userEmail:currentUser.email||'', userAvatar:currentUser.photoURL||'',
            createdAt:serverTimestamp(), timestamp:serverTimestamp(),
            messages:[], comments:[], likes:[]
          };
          try{
            const ref=await addDoc(collection(db,'feed'),groupData);
            // 立即记入本地缓存，避免刚创建后因 snapshot/排序延迟显示“未加入”。
            window.__createdGroups=window.__createdGroups||new Set();
            window.__createdGroups.add(ref.id);
            await showAlert('群创建成功，你已自动加入该群。');
            await openGroup(ref.id);
          }catch(e){await showAlert('创建失败：'+e.message)}
        }
        async function openGroup(gid){
          const panel=document.getElementById('viewGroups');
          try{
            const gs=await getDoc(doc(db,'feed',gid));
            if(!gs.exists()){await showAlert('群聊不存在或已删除');return;}
            const g=gs.data()||{};
            const membersIds=Array.from(new Set([...(g.members||[]),...(g.memberIds||[]),...(g.joinedUsers||[])]));
            const users=await getAllUsers();
            const members=users.filter(u=>membersIds.includes(u.uid));
            const joined=membersIds.includes(currentUser.uid)||g.ownerId===currentUser.uid||g.creatorId===currentUser.uid;
            activeGroupId=gid;
            if(groupChatUnsub) groupChatUnsub();
            panel.innerHTML=`<div class="app-container"><div class="top-bar">
              <button class="btn-sm" id="backGroups"><i class="fas fa-arrow-left"></i> 返回</button>
              <h3><i class="fas fa-users"></i> ${esc(g.name||'群聊')}</h3>
            </div>
            <div class="profile-card" style="display:block">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
                <img class="result-avatar" style="width:58px;height:58px" src="${esc(g.avatar||g.userAvatar||`https://ui-avatars.com/api/?background=0969da&color=fff&name=${encodeURIComponent(g.name||'Group')}`)}">
                <div><strong>${esc(g.name||'未命名群')}</strong><div class="timestamp">${joined?'已加入':'未加入'} · ${membersIds.length} 名成员</div></div>
              </div>
              <div class="group-members">${members.map(u=>`<span class="following-chip user-clickable" data-user="${esc(u.uid)}"><img src="${esc(avatarOf(u))}" style="width:20px;height:20px;border-radius:50%;vertical-align:middle"> ${esc(u.displayName||u.email||u.uid)}</span>`).join('')}</div>
              <p style="margin-top:12px">邀请码：<strong>${esc(g.inviteCode||gid.slice(0,8))}</strong></p>
              <div id="groupQr" class="qr-box"></div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
                ${!joined?`<button class="btn-primary" id="joinGroupBtn"><i class="fas fa-user-plus"></i> 加入群聊</button>`:`<span class="following-chip"><i class="fas fa-check"></i> 你已加入</span>`}
                <button class="btn-sm" id="groupInvite"><i class="fas fa-qrcode"></i> 邀请二维码</button>
              </div>
            </div>
            ${joined?`<div class="chat-window" style="margin-top:12px">
              <div class="chat-head"><div style="flex:1"><strong>群聊消息</strong><div class="timestamp">实时消息 · ${membersIds.length} 人</div></div><i class="fas fa-signal"></i></div>
              <div id="groupMessages" class="chat-messages" style="min-height:300px">加载中…</div>
              <div style="display:flex;gap:7px;padding:8px;border-top:1px solid var(--border-color)">
                <label class="dock-icon" title="发送文件"><i class="fas fa-paperclip"></i><input id="groupFileInput" type="file" hidden multiple></label>
                <textarea id="groupInput" placeholder="在 ${esc(g.name||'群聊')} 中发送消息…" style="flex:1;min-height:42px;max-height:110px;resize:none;margin:0;border-radius:15px;padding:10px 12px"></textarea>
                <button class="dock-icon dock-send" id="groupSendBtn"><i class="fas fa-paper-plane"></i></button>
              </div>
            </div>`:''}
            <div class="profile-card" style="margin-top:12px;display:block">
              <strong><i class="fas fa-link"></i> 通过邀请码加入</strong>
              <div style="display:flex;gap:7px;margin-top:8px"><input id="inviteJoinInput" class="modal-input" placeholder="输入邀请码，例如 MBABC1234" style="flex:1"><button class="btn-primary" id="inviteJoinBtn">加入</button></div>
            </div></div>`;
            document.getElementById('backGroups').onclick=()=>{activeGroupId=null;if(groupChatUnsub)groupChatUnsub();renderGroupsView()};
            if(g.inviteCode){try{new QRCode(document.getElementById('groupQr'),{text:location.href.split('#')[0]+'#group='+encodeURIComponent(g.inviteCode),width:150,height:150})}catch(e){}}
            document.getElementById('groupInvite')?.addEventListener('click',()=>document.getElementById('groupQr')?.scrollIntoView({behavior:'smooth'}));
            const join=async(groupId)=>{
              try{
                await updateDoc(doc(db,'feed',groupId),{members:arrayUnion(currentUser.uid),memberIds:arrayUnion(currentUser.uid),joinedUsers:arrayUnion(currentUser.uid)});
                await openGroup(groupId);
              }catch(e){await showAlert('加入群聊失败：'+e.message)}
            };
            document.getElementById('joinGroupBtn')?.addEventListener('click',()=>join(gid));
            document.getElementById('inviteJoinBtn')?.addEventListener('click',async()=>{
              const code=document.getElementById('inviteJoinInput')?.value.trim().toUpperCase();
              if(!code)return;
              try{
                const snap=await getDocs(query(collection(db,'feed'),orderBy('timestamp','desc')));
                let found=null;snap.forEach(d=>{const x=d.data()||{};if(!found&&x.type==='group'&&String(x.inviteCode||'').toUpperCase()===code)found=d.id});
                if(!found){await showAlert('邀请码无效或群聊不存在');return;}
                await join(found);
              }catch(e){await showAlert('邀请码加入失败：'+e.message)}
            });
            if(joined) startGroupRealtime(gid);
            const hash=decodeURIComponent(location.hash||'');
            if(hash.startsWith('#group=') && hash.slice(7)===String(g.inviteCode||'')) history.replaceState({},document.title,location.pathname+location.search);
          }catch(e){await showAlert('打开群聊失败：'+e.message)}
        }

        function startGroupRealtime(gid){
          const box=document.getElementById('groupMessages'); if(!box)return;
          if(groupChatUnsub)groupChatUnsub();
          try{
            const q=query(collection(db,'feed'),orderBy('timestamp','asc'));
            groupChatUnsub=onSnapshot(q,snap=>{
              const msgs=[];snap.forEach(d=>{const x=d.data()||{};if(x.type==='groupMessage'&&x.groupId===gid)msgs.push({...x,id:d.id})});
              box.innerHTML=msgs.map(m=>{
                const mine=m.senderId===currentUser.uid;
                const av=m.senderAvatar||`https://ui-avatars.com/api/?background=0969da&color=fff&name=${encodeURIComponent(m.senderName||'User')}`;
                return `<div class="bubble ${mine?'mine':''}" style="display:flex;gap:7px;align-items:flex-start"><img src="${esc(av)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover"><div><div style="font-size:.72rem;opacity:.75;margin-bottom:2px">${esc(m.senderName||'User')}</div>${renderMarkdown(m.text||'')}${m.fileUrl?`<div style="margin-top:4px"><a href="${esc(m.fileUrl)}" target="_blank" style="color:inherit"><i class="fas fa-paperclip"></i> ${esc(m.fileName||'文件')}</a></div>`:''}<div class="bubble-time">${m.timestamp?.toDate?m.timestamp.toDate().toLocaleTimeString():''}</div></div></div>`;
              }).join('')||'<div class="timestamp" style="text-align:center">群聊还没有消息，发送第一条吧</div>';
              box.scrollTop=box.scrollHeight;
            },err=>{box.innerHTML=`<div class="timestamp">群消息读取失败：${esc(err.message)}</div>`});
          }catch(e){box.textContent='群消息读取失败：'+e.message}
        }

        async function sendGroupMessage(){
          if(!currentUser||!activeGroupId)return;
          const input=document.getElementById('groupInput'), files=document.getElementById('groupFileInput');
          const text=input?.value.trim()||'', fs=files?.files||[];
          if(!text&&!fs.length)return;
          let uploaded=null;if(fs.length)uploaded=await uploadToCloudinary(fs[0],'group_files');
          try{
            await addDoc(collection(db,'feed'),{type:'groupMessage',groupId:activeGroupId,senderId:currentUser.uid,senderName:currentUser.displayName||currentUser.email?.split('@')[0]||'User',senderAvatar:currentUser.photoURL||'',text,fileUrl:uploaded?.url||null,fileName:fs[0]?.name||null,timestamp:serverTimestamp()});
            input.value='';if(files)files.value='';
          }catch(e){await showAlert('群消息发送失败：'+e.message)}
        }
        document.addEventListener('click',e=>{if(e.target.closest('#groupSendBtn'))sendGroupMessage()});
        document.addEventListener('keydown',e=>{if(e.target?.id==='groupInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendGroupMessage()}});
        window.addEventListener('hashchange',async()=>{
          const h=decodeURIComponent(location.hash||'');if(!h.startsWith('#group='))return;
          const code=h.slice(7);try{const snap=await getDocs(query(collection(db,'feed'),orderBy('timestamp','desc')));let gid=null;snap.forEach(d=>{const x=d.data()||{};if(!gid&&x.type==='group'&&String(x.inviteCode||'').toUpperCase()===code.toUpperCase())gid=d.id});if(gid){switchView('groups');setTimeout(()=>openGroup(gid),50)}}catch(e){}}
        );

        async function runGlobalSearch(term){
          term=term.trim().toLowerCase(); if(!term)return;
          const users=await getAllUsers(); const usersFound=users.filter(u=>`${u.displayName||''} ${u.email||''} ${u.nickname||''}`.toLowerCase().includes(term)).slice(0,10);
          const panel=document.getElementById('viewPosts');
          panel.innerHTML=`<div class="app-container"><div class="top-bar"><h3>${icon('search')} 搜索：${esc(term)}</h3></div><h4>用户</h4><div class="search-results">${usersFound.map(userRow).join('')||'无用户'}</div><h4 style="margin-top:18px">帖子</h4><div id="searchFeed" class="search-results">搜索中…</div></div>`;
          document.querySelectorAll('.view-panel').forEach(v=>v.classList.remove('active'));panel.classList.add('active');
          try{const snap=await getDocs(query(collection(db,'feed'),orderBy('timestamp','desc')));const hits=[];snap.forEach(d=>{const x=d.data();if(JSON.stringify(x).toLowerCase().includes(term))hits.push(d)});document.getElementById('searchFeed').innerHTML=hits.slice(0,30).map(d=>renderFeedItem(d,currentUser)).join('')||'无匹配帖子'}catch(e){document.getElementById('searchFeed').textContent='搜索失败：'+e.message}
        }
        document.getElementById('globalSearch')?.addEventListener('keydown',e=>{if(e.key==='Enter')runGlobalSearch(e.target.value)});

        // Parse /_CtEvts only in posts, never in comments/replies/groups.
        function parseCreatingEvent(text){
          const m=String(text||'').match(/\/_CtEvts:\s*(.+?)(?:\n|$)/i);return m?m[1].trim():null;
        }
        async function toggleCreatingEvent(feedId,done){
          const ref=doc(db,'feed',feedId), snap=await getDoc(ref);if(!snap.exists()||snap.data().userId!==currentUser.uid)return;
          await updateDoc(ref,{eventDone:done});
        }
        async function editCreatingEvent(feedId,current){
          const val=await showPrompt('修改 Creating Event','/ _CtEvts',current); if(val===null)return;
          const ref=doc(db,'feed',feedId),snap=await getDoc(ref);if(!snap.exists()||snap.data().userId!==currentUser.uid)return;
          const data=snap.data();let content=String(data.content||'');content=content.replace(/\/_CtEvts:\s*.*?(?=\n|$)/i,`/_CtEvts: ${val}`);
          await updateDoc(ref,{content,eventText:val});
        }
        // Add event UI to existing rendered posts without altering ordinary comments/replies.
        const oldRenderFeedItem=renderFeedItem;
        renderFeedItem=function(docSnap,user){
          let out=oldRenderFeedItem(docSnap,user), d=docSnap.data(), ev=d.type==='post'?parseCreatingEvent(d.content):null;
          if(ev){
            const done=!!d.eventDone, mine=user?.uid===d.userId;
            const box=`<div class="event-box ${done?'done':''}" data-event-id="${esc(docSnap.id)}"><div class="event-title">${icon(done?'task_alt':'radio_button_unchecked')} Creating Event</div><div>${esc(ev)}</div><div class="event-actions">${mine?`<button class="btn-sm event-toggle">${done?'标记未完成':'标记完成'}</button><button class="btn-sm event-edit">${icon('edit')}编辑</button>`:''}</div></div>`;
            out=out.replace(/(<div class="engagement-area">)/,box+'$1');
          }
          return out;
        };
        document.addEventListener('click',async e=>{
          const box=e.target.closest('.event-box');if(!box)return;const id=box.dataset.eventId;
          if(e.target.closest('.event-toggle')){const snap=await getDoc(doc(db,'feed',id));await toggleCreatingEvent(id,!snap.data().eventDone)}
          if(e.target.closest('.event-edit')){const snap=await getDoc(doc(db,'feed',id));await editCreatingEvent(id,parseCreatingEvent(snap.data().content)||'')}
        });

        // Automatic image preview for chat/group files, except long images.
        function isLongImage(w,h){return h/w>2.5}
        async function previewChatImage(file){
          if(!file?.type.startsWith('image/'))return;
          const img=new Image();img.onload=()=>{if(isLongImage(img.naturalWidth,img.naturalHeight))return;};
          img.src=URL.createObjectURL(file);
        }
        chatFileInput?.addEventListener('change',()=>Array.from(chatFileInput.files||[]).forEach(previewChatImage));

        // Sidebar mini user is always available after auth.
        function refreshSidebarUser(){
          const el=document.getElementById('sidebarUserMini');if(!el||!currentUser)return;
          el.innerHTML=`<div class="result-card" style="border:0;padding:8px;background:transparent"><img class="result-avatar" src="${esc(avatarOf(currentUser))}"><div style="min-width:0"><strong>${esc(currentUser.displayName||currentUser.email)}</strong><div class="timestamp">${esc(currentUser.email)}</div></div></div>`;
        }
        const oldAuthListener = onAuthStateChanged; // marker for source compatibility
        setTimeout(refreshSidebarUser,500);

    </script>
</body>
</html>
